  "棄":"弃","構":"构","樂":"乐","標":"标","樹":"树","橫":"横","權":"权","歷":"历",

  "說":"说","煉":"炼","猶":"犹","雲":"云","細":"细","節":"节","詳":"详","階":"阶",
  "徑":"径","縮":"缩"
};
const toSimpText=str=>[...String(str||"")].map(c=>T2S_MAP[c]||c).join("");
let isSimpUI=false;
function simpSkip(el){
  return !el||!el.closest||!!(el.closest(".dos-header")||el.closest(".dos-main-title")||el.closest(".rad-main-card")||el.closest(".aux-glyph")||el.closest(".ch")||el.closest(".tr")||el.closest(".rs")||el.closest(".xz-glyph"));
}
function applySimpUI(root){
  const scope=root&&root.nodeType===1?root:document.documentElement;
  const w=document.createTreeWalker(scope,NodeFilter.SHOW_TEXT,null);
  const nodes=[];let n;
  while((n=w.nextNode()))nodes.push(n);
  nodes.forEach(tn=>{
    const p=tn.parentElement;
    if(!p||simpSkip(p)||!tn.textContent.trim())return;
    if(isSimpUI){
      if(tn.__orig===undefined)tn.__orig=tn.textContent;
      const t=toSimpText(tn.textContent);
      if(t!==tn.textContent)tn.textContent=t;
    }else if(tn.__orig!==undefined){
      tn.textContent=tn.__orig;
    }
  });
}
function toggleSimpUI(){
  isSimpUI=!isSimpUI;
  const btn=document.getElementById("btnToggleSimpMode");
  if(btn)btn.textContent=isSimpUI?"［繁转简］":"［繁轉簡］";
  applySimpUI(document);
}

<script>
"use strict";
const C1="#0ff", C2="#5f5", C3="#ff80ab";

/* 全書 26 頁結構化教材資料（0=引言, 1..24=A日..Y卜, 25=總結） */
const PAGES = [
  {
    type:"intro",
    badge:"第 1 / 26 頁：全書引言與鍵位總覽",
    rightTag:"簡體字專屬校訂版"
  },
  {
    key:"A", rad:"日", en:"Sun", cat:"第 2 / 26 頁：哲理類字根",
    aux:[
      {g:"曰", c:C1, title:"扁日／曰框", desc:"四面封閉中有一橫（如：曲、更、书底）"},
      {g:"⺜", c:C2, title:"日形變體", desc:"局部封閉帶一橫（如：冒、冕上）"}
    ],
    slogan:`凡四面封閉且中間僅有一橫的方框，與扁平「<b style="color:${C1}">曰</b>」同歸 <i class="ky">A</i> 鍵。`,
    rules:[
      `<b>基本形獨立成字：</b>鍵面字「<b class="tr">日</b>」獨立出現時，只取一碼 <i class="ky">A</i>（合體字如「<b>晒</b>」拆為日一金田 <i class="cd">AMCW</i>）。`,
      `<b><span style="color:${C1}">曰</span>（扁日）與 <span style="color:${C2}">⺜</span>（日形變體）：</b>寬扁的「<b style="color:${C1}">曰</b>」字（單字亦取 <i class="ky">A</i>）及「更、曲、书」中的封閉帶橫方框，皆視同日取 <i class="ky">A</i>。`,
      `<b>位置特性：</b>常作左偏旁（晒、晓）、字頭（早、星）或字底（旧、昌）。`
    ],
    examples:[
      ["基本形 日","#ff5","晒","AMCW",`左字首「<b class="tr">日</b>」取日 (<i class="ky">A</i>)，右字身「西」拆為一金田 (<i class="cd">MCW</i>)，組為：日一金田 (<i class="cd">AMCW</i>)。`],
      ["基本形 日","#ff5","晓","AJPU",`左字首「<b class="tr">日</b>」取日 (<i class="ky">A</i>)，右字身「尧」拆為十心山 (<i class="cd">JPU</i>)，連為：日十心山 (<i class="cd">AJPU</i>)。`],
      ["輔助形 曰",C1,"更","MLWK",`首橫取一 (<i class="ky">M</i>)，中「<b style="color:${C1}">曰</b>」連豎撇取中田 (<i class="cd">LW</i>)，底交叉取大 (<i class="ky">K</i>)，為 <i class="cd">MLWK</i>。`],
      ["輔助形 ⺜",C2,"冒","ABU",`上部日形框「<b style="color:${C2}">⺜</b>」取日 (<i class="ky">A</i>)，下部「目」拆為月山 (<i class="cd">BU</i>)，組為：日月山 (<i class="cd">ABU</i>)。`]
    ],
    adv:`• <b style="color:${C1}">三種方框終極辨析</b>：內部<b>有一橫</b>的封閉框「<b class="tr">日</b> / <b style="color:${C1}">曰</b>」取日 (<i class="ky">A</i>)；內部<b>空無一物</b>的小方框「<b>口</b>」取口 (<i class="ky">R</i>)；內部<b>包有其他部件</b>的大外框「<b>囗</b>」取田 (<i class="ky">W</i>)。<br>• <b style="color:${C2}">易混字提醒</b>：「<b>目</b>」內部有兩橫，外框下開口視同月，拆為月山 (<i class="cd">BU</i>)，不可誤按 <i class="ky">A</i>。`,
    rhyme:"押韻：光／方／旁，粵音 -ong 平聲",
    poem:`<i class="tr">日</i>字當頭耀萬光，扁<b style="color:${C1}">曰</b>同歸 <i class="ky">A</i> 鍵方。　<i class="tr">日</i><i class="cd">木戈</i>「<b class="tr">时</b>」<i class="cd">中</i><i class="tr">日</i>「<b class="tr">旧</b>」，<i class="tr">日</i><i class="cd">十心山</i>「<b class="tr">晓</b>」在旁。`

/* 狀態與導航控制（curPage = -1 為總目錄索引；0..25 為第 1..26 頁） */
let curPage = -1;

/* 返回主程式 index.html（同時相容 iframe postMessage、opener 與同視窗相對路徑跳轉） */
function exitToMainApp(){
  if(window.parent && window.parent !== window){
    window.parent.postMessage({type:"closeTutorial", action:"closeTutorial"}, "*");
    window.parent.postMessage("closeTutorial", "*");
    return;
  }
  if(window.opener && !window.opener.closed){
    window.close();
    return;
  }
  window.location.href = "index.html";
}

function goPage(idx){
  curPage = idx;
  const win = document.getElementById("mainWin");
  const btnEsc = document.getElementById("btnEscIdx");
  const btnPrev = document.getElementById("btnPrevPage");
  const btnNext = document.getElementById("btnNextPage");
  const hint = document.getElementById("footerHint");

  if(curPage === -1){
    win.innerHTML = renderIndexHTML();
    btnEsc.textContent = "Esc [主選單]";
    btnPrev.textContent = "◀ 總結";
    btnNext.textContent = "開始學習 ▶";
    hint.textContent = "點擊字根卡片或按 A-Y 進入 ｜ Esc 返回主選單 (index.html)";
    if(history.replaceState) history.replaceState(null, "", location.pathname);
  } else {
    const p = PAGES[curPage];
    if(p.type === "intro") win.innerHTML = renderIntroHTML();
    else if(p.type === "summary") win.innerHTML = renderSummaryHTML();
    else win.innerHTML = renderRadicalHTML(p);

    btnEsc.textContent = "Esc [索引]";
    btnPrev.textContent = curPage === 0 ? "◀ 返回索引" : "◀ 上一頁";
    btnNext.textContent = curPage === PAGES.length - 1 ? "返回索引 ▶" : "下一頁 ▶";
    hint.textContent = `第 ${curPage + 1} / 26 頁 ｜ Esc 返回索引 ｜ ← → 切換上下頁`;
    const hashTag = p.key ? p.key : (p.type === "intro" ? "INTRO" : "SUMMARY");
    if(history.replaceState) history.replaceState(null, "", "#" + hashTag);
  }
  if(isSimpUI) applySimpUI(document);
}

function prevPage(){
  if(curPage === -1) goPage(PAGES.length - 1);
  else if(curPage === 0) goPage(-1);
  else goPage(curPage - 1);
}

function nextPage(){
  if(curPage === -1) goPage(0);
  else if(curPage >= PAGES.length - 1) goPage(-1);
  else goPage(curPage + 1);
}

document.getElementById("btnEscIdx").addEventListener("click", () => {
  if(curPage === -1) exitToMainApp();
  else goPage(-1);
});
document.getElementById("btnPrevPage").addEventListener("click", prevPage);
document.getElementById("btnNextPage").addEventListener("click", nextPage);

/* 鍵盤控制：內頁按 Esc 返回索引目錄，在索引目錄再按 Esc 即返回主程式 index.html */
window.addEventListener("keydown", e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === "Escape"){
    e.preventDefault();
    if(curPage === -1) exitToMainApp();
    else goPage(-1);
  } else if(e.key === "ArrowRight" || e.key === "Enter" || e.key === "PageDown"){
    e.preventDefault();
    nextPage();
  } else if(e.key === "ArrowLeft" || e.key === "PageUp"){
    e.preventDefault();
    prevPage();
  } else if(curPage === -1 && /^[a-wy]$/i.test(e.key)){
    const k = e.key.toUpperCase();
    const idx = PAGES.findIndex(p => p.key === k);
    if(idx !== -1){ e.preventDefault(); goPage(idx); }
  }
});

/* 畫面自適應縮放 */
function scaleScreen(){
  const el = document.getElementById("dosScreen");
  if(!el) return;
  const W = window.innerWidth, H = window.innerHeight;
  const sc = Math.min((W - 12) / 960, (H - 12) / 540);
  el.style.transform = `scale(${Math.max(0.25, sc).toFixed(4)})`;
}
window.addEventListener("resize", scaleScreen);
scaleScreen();

/* 支援網址 Hash（如 #A、#Q、#INTRO、#SUMMARY）初始化與動態切換 */
function applyHashRoute(){
  const h = location.hash.replace("#","").toUpperCase();
  if(!h){ goPage(-1); return; }
  if(h === "INTRO" || h === "01" || h === "1"){ goPage(0); return; }
  if(h === "SUMMARY" || h === "26"){ goPage(25); return; }
  const idx = PAGES.findIndex(p => p.key === h);
  goPage(idx !== -1 ? idx : -1);
}
window.addEventListener("hashchange", applyHashRoute);
applyHashRoute();
</script>

<style id="unifiedScrollStyle">
.scroll-box, #tutPageContent, .tut-content {
  overflow-y: auto !important;
  overscroll-behavior: contain;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
</style>
<script id="unifiedScrollScript">
/* === UNIFIED_SCROLL_HELPER_START === */
(function(){
  const STEP = 95;
  function getActiveScrollBox(){
    const selectors = [
      "#tutPageContent",
      "#aboutWindow > div:nth-child(2)",
      "#leaderboardWindow > div:nth-child(2)",
      ".tut-content"
    ];
    for(const sel of selectors){
      const el = document.querySelector(sel);
      if(el && el.offsetParent !== null) return el;
    }
    return null;
  }
  function scrollActiveBox(deltaY){
    const box = getActiveScrollBox();
    if(!box) return false;
    box.scrollBy({ top: deltaY, behavior: "smooth" });
    return true;
  }
  window.__scrollActiveBox = scrollActiveBox;

  // 1. 滑鼠滾輪全區域支援
  window.addEventListener("wheel", function(e){
    const box = getActiveScrollBox();
    if(!box) return;
    if(!box.contains(e.target)){
      box.scrollTop += e.deltaY;
    }
  }, { passive: true });

  // 2. 鍵盤上下鍵集中攔截支援
  window.addEventListener("keydown", function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    const el = document.activeElement;
    if(el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) return;
    if(e.key === "ArrowUp"){
      if(scrollActiveBox(-STEP)) e.preventDefault();
    } else if(e.key === "ArrowDown"){
      if(scrollActiveBox(STEP)) e.preventDefault();
    }
  }, true);

})();
/* === UNIFIED_SCROLL_HELPER_END === */
</script>
