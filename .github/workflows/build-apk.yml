name: Build Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Cordova APK
        run: |
          npm install -g cordova
          cordova create app com.ckfromhk.cangjie "快快快樂學倉頡"
          cd app
          cordova platform add android
          rm -rf www/*
          cp ../*.html www/ 2>/dev/null || true
          cp ../*.js www/ 2>/dev/null || true
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cangjie-Offline-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
